# Alembic 設定（開發時用 CLI，例如 `alembic revision --autogenerate -m "..."`）
# 資料庫連線從 DATABASE_URL 環境變數讀取，見 app/migrations/env.py。
# 服務啟動時會自動執行 migration（app/db_migrations.py），不需要手動 upgrade。

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
